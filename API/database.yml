development:
  dialect: postgres
  database: "{{envOr "DB_NAME" "game"}}"
  user: "{{envOr "DB_USER" "postgres"}}"
  password: "{{envOr "DB_PASSWORD" "postgres"}}"
  host: "{{envOr "DB_HOST" "127.0.0.1"}}"
  port: "{{envOr "DB_PORT" "5432"}}"
  pool: 5

test:
  dialect: postgres
  database: "{{envOr "DB_NAME" "game"}}_test"
  user: "{{envOr "DB_USER" "postgres"}}"
  password: "{{envOr "DB_PASSWORD" "postgres"}}"
  host: "{{envOr "DB_HOST" "127.0.0.1"}}"
  port: "{{envOr "DB_PORT" "5432"}}"
  pool: 5

production:
  dialect: postgres
  url: "{{envOr "DATABASE_URL" "postgres://postgres:postgres@localhost:5432/game"}}"
  pool: 10
